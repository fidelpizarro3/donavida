name: donavida

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: donavida
      POSTGRES_PASSWORD: donavida
      POSTGRES_DB: donavida
    ports:
      # 5433 afuera para no chocar con un Postgres instalado localmente (que suele usar 5432)
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Servidor de correo de desarrollo: recibe los emails que manda la API (SMTP en 1025)
  # sin enviarlos a nadie, y los muestra en http://localhost:8025
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
