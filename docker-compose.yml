name: donavida

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: donavida
      POSTGRES_PASSWORD: donavida
      POSTGRES_DB: donavida
    ports:
      # 5433 afuera para no chocar con un Postgres instalado localmente (que suele usar 5432)
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
